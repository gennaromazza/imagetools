<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FileX Suite Dock</title>
  <link rel="stylesheet" href="./dock-window.css" />
</head>
<body class="collapsed booting">
  <div class="dock-window">
    <button id="suite-toggle" class="suite-toggle" title="Espandi FileX Suite"><img src="./icons/suite-launcher.png" alt="FileX Suite" /></button>
    <div id="dock-tools" class="dock-tools"></div>
    <button id="dock-settings" class="dock-settings" title="Impostazioni dock">&#9881;</button>
    <div id="dock-controls" class="dock-controls" hidden>
      <label>Trasparenza <input id="dock-opacity" type="range" min="45" max="100" value="94" /></label>
      <label class="dock-check"><input id="dock-autohide" type="checkbox" /> Riduci automaticamente</label>
      <span class="dock-hint">Trascina le icone per riordinarle</span>
      <button id="dock-collapse" type="button">Riduci a icona</button>
      <button id="dock-reset" type="button">Ripristina posizione</button>
      <button id="dock-close-settings" type="button" aria-label="Chiudi impostazioni">×</button>
    </div>
  </div>
  <script type="module" src="./dock-window.js"></script>
</body>
</html>
