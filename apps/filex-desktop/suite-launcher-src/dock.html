<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'">
<title>FileX Suite Launcher</title><link rel="stylesheet" href="./launcher.css">
</head>
<body>
<div id="tooltip" role="tooltip" hidden></div>
<div id="surface">
  <section id="settings-panel" class="panel" hidden aria-label="Aspetto della dock">
    <h2>Aspetto</h2>
    <label for="theme">Tema</label>
    <select id="theme"><option value="filex">Verde FileX</option><option value="black">Nero</option><option value="system">Come Windows</option><option value="custom">Personalizzato</option></select>
    <label id="color-label" for="custom-color" hidden>Colore (es. #243447)</label>
    <input id="custom-color" type="text" value="#243447" maxlength="7" pattern="#[0-9a-fA-F]{6}" hidden aria-label="Colore personalizzato esadecimale">
    <p class="hint">Clic destro su un programma per aggiungerlo ai preferiti. Da tastiera: Maiusc+F.</p>
  </section>
  <section id="notifications-panel" class="panel" hidden aria-label="Notifiche FileX">
    <div class="panel-header"><h2>Notifiche</h2><button id="clear-notifications">Pulisci</button></div>
    <div id="notifications-list"></div>
  </section>
  <div id="search-panel" class="panel" hidden>
    <label class="sr-only" for="search">Cerca un programma</label>
    <input id="search" type="search" placeholder="Cerca un programma…" autocomplete="off">
  </div>
  <p id="status" role="status" hidden></p>
  <nav id="dock" aria-label="Programmi FileX">
    <div id="tools" role="group" aria-label="Programmi installati"></div>
    <button id="controls-toggle" class="control" aria-label="Espandi comandi" aria-expanded="false" aria-controls="controls" data-tip="Espandi comandi"><span id="controls-chevron">‹</span><span id="collapsed-notification-dot" hidden></span></button>
    <div id="controls" hidden>
      <button id="search-toggle" class="control" aria-label="Cerca" aria-expanded="false" aria-controls="search-panel" data-tip="Cerca un programma"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg></button>
      <button id="notifications-toggle" class="control" aria-label="Notifiche" aria-expanded="false" aria-controls="notifications-panel" data-tip="Notifiche"><svg viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5l-2 3M10 21h4M12 2v2"/></svg><span id="notification-count" hidden></span></button>
      <button id="settings-toggle" class="control" aria-label="Aspetto" aria-expanded="false" aria-controls="settings-panel" data-tip="Aspetto della dock"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg></button>
      <button id="manage" class="control" aria-label="Gestisci FileX Suite" data-tip="Gestisci FileX Suite"><img src="./icons/suite-launcher.png" alt=""></button>
    </div>
  </nav>
</div>
<script type="module" src="./launcher.js"></script>
</body></html>
