name: Sync FileX website after Suite release

on:
  workflow_run:
    workflows: ["FileX component release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      suite_version:
        description: "Versione Suite da pubblicare sul sito (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: filex-website-suite-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'suite-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.event.workflow_run.head_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update website Suite download
        env:
          SUITE_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('suite-v{0}', inputs.suite_version) || github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          version="${SUITE_VERSION#suite-v}"
          node scripts/update-website-suite-download.mjs "$version"

      - name: Deploy website to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --project gen-lang-client-0321087169 --only hosting:filex-website --token "$FIREBASE_TOKEN" --non-interactive

      - name: Verify public Suite download
        env:
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && format('suite-v{0}', inputs.suite_version) || github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          html="$(curl --fail --silent --show-error --location https://filex-suite.web.app/)"
          version="${EXPECTED_VERSION#suite-v}"
          grep -Fq "FileX Suite $version" <<< "$html"
          grep -Fq "suite-channel-stable/FileX-Suite-stable-x64-setup.exe" <<< "$html"
