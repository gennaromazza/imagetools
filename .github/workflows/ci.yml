name: FileX CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: filex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    env:
      # Validation never launches or packages Electron. Skipping the binary avoids
      # concurrent workspace installers racing on the shared Windows cache.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate independent release contract
        run: npm.cmd run test:filex-independent-releases

      - name: Validate FileX ID Photo packaged runtime
        run: npm.cmd run test:id-photo-package-runtime

      - name: Validate FileX ID Photo non-destructive working files
        run: npm.cmd run test:id-photo-working-files

      - name: Validate FileX ID Photo output fingerprints
        run: npm.cmd run test:id-photo-file-fingerprint

      - name: Validate FileX ID Photo unsaved-close guard
        run: npm.cmd run test:id-photo-unload-guard

      - name: Validate Batch Print Layout and atomic output transactions
        run: npm.cmd run test:batch-print-layout-bug-hunt

      - name: Validate Archivio Flow packaged runtime
        run: npm.cmd run test:archivio-flow-package-runtime

      - name: Validate cross-tool photo handoff
        run: npm.cmd run test:photo-tool-handoff

      - name: Validate Archivio Flow photo routing
        run: npm.cmd run test:archivio-flow-photo-routing

      - name: Validate updater file locking
        run: npm.cmd run test:filex-updater-lock

      - name: Validate licensing coverage
        run: npm.cmd run test:filex-license-coverage

      - name: Test Image Party Frame bug hunt
        run: npm.cmd run test:image-party-frame-bug-hunt

      - name: Test Image Party Frame export server
        run: npm.cmd run test:image-party-frame-server

      - name: Validate Image Party Frame packaged runtime
        run: npm.cmd run test:image-party-frame-package-runtime

      - name: Typecheck workspaces
        run: npm.cmd run typecheck

      - name: Build Suite without tool renderers
        run: npm.cmd --workspace @photo-tools/filex-desktop run build:suite

      - name: Build active tool renderers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd --workspace @photo-tools/photo-selector-app run build
          npm.cmd --workspace @photo-tools/image-party-frame-app run build
          npm.cmd --workspace @photo-tools/batch-print-layout run build
          npm.cmd run test:id-photo
          npm.cmd --workspace @photo-tools/id-photo run build
          npm.cmd --workspace @photo-tools/archivio-flow run build
          npm.cmd --workspace @photo-tools/cache-sweep run test
          npm.cmd --workspace @photo-tools/cache-sweep run build
          npm.cmd --workspace @photo-tools/filex-send run test
          npm.cmd --workspace @photo-tools/filex-send run build
          npm.cmd --workspace @photo-tools/filex-send-remote-server run test
          npm.cmd --workspace @photo-tools/filex-send-remote-server run build
          npm.cmd --workspace @photo-tools/backup-guard run test
          npm.cmd --workspace @photo-tools/backup-guard run build
          npm.cmd --workspace @photo-tools/filex-cloud-functions run test
          npm.cmd --workspace @photo-tools/filex-cloud-functions run typecheck
          npm.cmd --workspace @photo-tools/filex-cloud-functions run build

      - name: Validate stable manifest
        run: npm.cmd --workspace @photo-tools/filex-desktop run manifest:validate:stable

      - name: Validate Git hygiene
        run: npm.cmd run check:git-hygiene
