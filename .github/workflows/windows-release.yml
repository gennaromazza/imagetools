name: FileX Windows Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      version:
        description: Version tag (es. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      FILEX_RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'stable' || inputs.channel }}
      FILEX_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      FILEX_CODE_SIGNING: "1"
      CSC_LINK: ${{ secrets.FILEX_WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.FILEX_WINDOWS_CSC_KEY_PASSWORD }}
      FILEX_MANIFEST_HMAC_KEY: ${{ secrets.FILEX_MANIFEST_HMAC_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build FileX Suite installer
        shell: pwsh
        run: |
          $env:FILEX_OUTPUT_DIR = ".output/releases-suite"
          npm run dist:filex-desktop:suite:win

      - name: Build Image Select Pro installer
        shell: pwsh
        run: |
          $env:FILEX_OUTPUT_DIR = ".output/releases-photo-selector"
          npm run dist:filex-desktop:photo-selector:win64

      - name: Prepare release assets and manifest
        shell: pwsh
        run: |
          $releaseDir = "apps/filex-desktop/.output/releases"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item "apps/filex-desktop/.output/releases-suite/*.exe" $releaseDir -Force
          Copy-Item "apps/filex-desktop/.output/releases-suite/*.exe.blockmap" $releaseDir -Force
          Copy-Item "apps/filex-desktop/.output/releases-suite/latest.yml" $releaseDir -Force
          Copy-Item "apps/filex-desktop/.output/releases-photo-selector/Image-Select-Pro-*.exe" $releaseDir -Force
          Copy-Item "apps/filex-desktop/.output/releases-photo-selector/Image-Select-Pro-*.exe.blockmap" $releaseDir -Force
          $baseUrl = "https://github.com/gennaromazza/imagetools/releases/download/$env:FILEX_RELEASE_VERSION"
          node ./scripts/generate-release-manifest.mjs --channel=$env:FILEX_RELEASE_CHANNEL --base-url=$baseUrl --min-launcher-version=0.1.0

      - name: Validate tool release manifest
        run: |
          cd apps/filex-desktop
          node ./scripts/validate-release-manifest.mjs --channel=$env:FILEX_RELEASE_CHANNEL

      - name: Create permanent Suite download alias
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/filex-desktop/.output/releases/FileX-Suite-*-stable-x64-setup.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one stable x64 Suite installer, found $($installers.Count)"
          }
          Copy-Item $installers[0].FullName "apps/filex-desktop/.output/releases/FileX-Suite-stable-x64-setup.exe"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FILEX_RELEASE_VERSION }}
          prerelease: ${{ env.FILEX_RELEASE_CHANNEL == 'beta' }}
          generate_release_notes: true
          files: |
            apps/filex-desktop/.output/releases/*.exe
            apps/filex-desktop/.output/releases/*.exe.blockmap
            apps/filex-desktop/.output/releases/latest.yml
            apps/filex-desktop/release-manifests/${{ github.event_name == 'push' && 'stable' || inputs.channel }}.json
